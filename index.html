<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babamın Garajı — Klasik Otomobil Arşivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#141B15;
    --bg-panel:#1D2620;
    --bg-panel-2:#232E27;
    --brass:#BB9A4B;
    --brass-bright:#D9BC72;
    --oxblood:#7C2F2A;
    --oxblood-bright:#A5453D;
    --cream:#EFE6D2;
    --muted:#93A090;
    --chrome:#5C665C;
    --line:#33402F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-deep);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--brass);color:#141B15;}

  /* texture */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    opacity:0.5;
  }

  header{
    position:relative;z-index:1;
    padding:38px 20px 26px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(ellipse at 50% -20%, rgba(187,154,75,0.10), transparent 60%),
      var(--bg-deep);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.28em;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:42px;
    letter-spacing:0.03em;
    margin:8px 0 6px;
    color:var(--cream);
    text-transform:uppercase;
  }
  h1 span{color:var(--brass-bright);}
  .subtitle{
    color:var(--muted);
    font-size:14px;
    max-width:440px;
    margin:0 auto;
    line-height:1.5;
  }
  .archive-count{
    margin-top:16px;
    display:inline-flex;
    gap:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass);
    border:1px solid var(--line);
    padding:8px 16px;
    border-radius:2px;
    background:var(--bg-panel);
  }
  .archive-count b{color:var(--cream);font-weight:600;}

  /* filters */
  .filters{
    position:sticky;top:0;z-index:5;
    background:rgba(20,27,21,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.04em;
    padding:7px 14px;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--bg-panel);
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--brass);color:var(--cream);}
  .chip.active{background:var(--brass);color:#141B15;border-color:var(--brass);font-weight:600;}

  main{position:relative;z-index:1;padding:24px 16px 80px;max-width:1100px;margin:0 auto;}

  .brand-block{margin-bottom:44px;}
  .brand-block[hidden]{display:none;}
  .brand-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding-bottom:10px;
    margin-bottom:16px;
    border-bottom:2px solid var(--brass);
  }
  .brand-name{
    font-family:'Oswald',sans-serif;
    font-size:24px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:var(--cream);
  }
  .brand-era{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:2px;
  }

  .car-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
  }

  .car-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease;
    display:flex;flex-direction:column;
  }
  .car-card:hover{transform:translateY(-3px);border-color:var(--brass);}
  .car-card:active{transform:translateY(-1px);}

  .car-plate{
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .car-plate::after{
    content:"FOTOĞRAF EKLENECEK";
    position:absolute;
    bottom:8px;left:8px;right:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:8px;
    letter-spacing:0.08em;
    color:rgba(239,230,210,0.55);
    text-align:left;
  }
  .car-plate .plate-year{
    font-family:'Oswald',sans-serif;
    font-size:34px;
    font-weight:700;
    color:rgba(239,230,210,0.85);
    letter-spacing:0.02em;
  }

  .car-info{padding:10px 12px 12px;}
  .car-model{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--cream);
    line-height:1.25;
    margin-bottom:4px;
  }
  .car-year{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--brass);
  }

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(10,14,11,0.88);
    display:none;
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    padding:0;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-panel);
    width:100%;
    max-width:640px;
    min-height:100vh;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  @media(min-width:680px){
    .modal-overlay{padding:40px 20px;}
    .modal{min-height:auto;border-radius:4px;}
  }
  .modal-close{
    position:sticky;top:0;z-index:2;
    display:flex;justify-content:flex-end;
    padding:14px 14px 0;
  }
  .modal-close button{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--cream);
    width:34px;height:34px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
  }
  .modal-hero{
    padding:0 20px;
    margin-top:-4px;
  }
  .photo-slots{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:130px 130px;
    gap:6px;
  }
  .photo-slots .slot-main{grid-row:span 2;}
  .slot{
    border-radius:3px;
    display:flex;align-items:flex-end;
    padding:8px;
    position:relative;
    overflow:hidden;
  }
  .car-plate{position:relative;}
  .slot-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    letter-spacing:0.1em;
    color:rgba(239,230,210,0.7);
    background:rgba(10,14,11,0.4);
    padding:2px 6px;
    border-radius:2px;
  }

  .modal-body{padding:20px;}
  .modal-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.15em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .modal-title{
    font-family:'Oswald',sans-serif;
    font-size:28px;
    font-weight:700;
    margin:6px 0 2px;
    color:var(--cream);
    text-transform:uppercase;
  }
  .modal-sub{color:var(--muted);font-size:13px;margin-bottom:18px;}

  .spec-plate{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
    margin-bottom:20px;
  }
  .spec-item .k{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .spec-item .v{font-size:13px;color:var(--cream);margin-top:2px;}

  .modal-body p.story{
    font-size:14.5px;
    line-height:1.7;
    color:#DAD2BE;
    margin-bottom:18px;
  }

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--brass);
    text-transform:uppercase;
    margin-bottom:10px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }

  .similar-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .similar-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:2px;
    color:var(--cream);
    cursor:pointer;
    background:var(--bg-deep);
  }
  .similar-chip:hover{border-color:var(--brass);color:var(--brass-bright);}

  .note-box{
    margin-top:8px;
  }
  .note-box textarea{
    width:100%;
    min-height:70px;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:10px;
    resize:vertical;
  }
  .note-box textarea:focus{outline:none;border-color:var(--brass);}
  .note-hint{font-size:11px;color:var(--muted);margin-top:6px;}

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--chrome);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  .zoom-hint{
    position:absolute;
    top:8px;right:8px;
    z-index:2;
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(10,14,11,0.55);
    color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    pointer-events:none;
  }
  .photo-slots .slot{cursor:zoom-in;}

  .lightbox-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(6,9,7,0.96);
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;
    padding:20px;
    cursor:zoom-out;
  }
  .lightbox-overlay.open{display:flex;}
  .lightbox-overlay img{
    max-width:100%;
    max-height:80vh;
    object-fit:contain;
    border-radius:3px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  .lightbox-caption{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--brass-bright);
    margin-bottom:14px;
    text-align:center;
  }
  .lightbox-close{
    position:absolute;
    top:16px;right:16px;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--cream);
    width:38px;height:38px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Bir aile arşivi</div>
  <h1>Babamın <span>Garajı</span></h1>
  <p class="subtitle">İkonlaştığı çağın klasikleriyle, marka marka derlenen bir otomobil koleksiyonu.</p>
  <div class="archive-count" id="archiveCount"></div>
</header>

<div class="filters" id="filters"></div>

<main id="main"></main>

<footer>BABAMIN GARAJI — KİŞİSEL ARŞİV — v0.1 PROTOTİP</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="event.stopPropagation();closeLightbox()">✕</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
  <img id="lightboxImg" src="" alt="" style="transition:opacity .2s ease;">
</div>

function commonsUrl(filename, width){
  const base = "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(filename);
  return width ? base + "?width=" + width : base;
}

    "Intermeccanica":["#2A1E3A","#5A3A73"],
    "Lamborghini":["#3A2A0E","#7C5A1E"], "Lotus":["#1E2A1E","#2E7350"],
    "Bentley":["#1E1E2A","#3A3A5A"], "Rolls-Royce":["#1E1E1E","#4A4A4A"],
    "Alvis":["#2A1E1E","#5A3A2E"], "Daimler":["#1E1E2A","#3A3A5A"],
    "Armstrong Siddeley":["#2A2A1E","#5A5A2E"], "Sunbeam":["#3A2A0E","#7C5A1E"],
    "Singer":["#2A1E2A","#5A3A5A"], "Standard":["#1E2A2A","#3A5A5A"],
    "NSU":["#1E2A3A","#3A5A73"], "Auto Union / DKW":["#2A1E1E","#5A3A2E"],
    "Borgward":["#1E2A1E","#3A5A3A"], "Glas":["#2A2A1E","#5A5A2E"],
    "Wartburg":["#3A1414","#7C2A2A"], "Škoda":["#1E3A2A","#2E7350"],
    "Tatra":["#3A1E1E","#732E2E"], "Holden":["#1E2A3A","#3A5A73"],
    "Lincoln":["#1E1E2A","#3A3A5A"], "Mercury":["#2A1E1E","#5A3A2E"],
    "Edsel":["#3A2A1E","#73502E"], "Kaiser-Frazer":["#1E2A2A","#3A5A5A"],
    "Nash":["#2A2A1E","#5A5A2E"], "Duesenberg":["#2A1E0E","#5A3A1E"],
    "Auburn":["#1E1E1E","#4A4A4A"], "Cord":["#2A1E1E","#5A3A2E"]
  };
  const [c1,c2] = palettes[brand] || ["#232E27","#33402F"];
  const angle = 120 + (idx*17)%80;
  return `linear-gradient(${angle}deg, ${c1}, ${c2})`;
}

function renderFilters(){
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  eraGroups.forEach(e=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeEra===e.id ? ' active':'');
    chip.textContent = e.label;
    chip.onclick = ()=>{ activeEra = e.id; renderFilters(); renderMain(); };
    wrap.appendChild(chip);
  });
  const divider = document.createElement('div');
  divider.style.cssText = 'width:1px;background:var(--line);margin:0 4px;flex:0 0 auto;';
  wrap.appendChild(divider);

  const allBrandChip = document.createElement('div');
  allBrandChip.className = 'chip' + (activeBrand==='all' ? ' active':'');
  allBrandChip.textContent = 'Tüm Markalar';
  allBrandChip.onclick = ()=>{ activeBrand='all'; renderFilters(); renderMain(); };
  wrap.appendChild(allBrandChip);

  DATA.forEach(b=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeBrand===b.brand ? ' active':'');
    chip.textContent = b.brand;
    chip.onclick = ()=>{ activeBrand = b.brand; renderFilters(); renderMain(); };
    wrap.appendChild(chip);
  });
}

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const eraDef = eraGroups.find(e=>e.id===activeEra);
  let visibleCount = 0;

  DATA.forEach(b=>{
    if(activeBrand!=='all' && activeBrand!==b.brand) return;
    const filteredCars = b.cars.filter(c => eraDef.id==='all' ? true : eraDef.test(c.year));
    if(filteredCars.length===0) return;
    visibleCount += filteredCars.length;

    const block = document.createElement('div');
    block.className = 'brand-block';
    block.innerHTML = `
      <div class="brand-head">
        <div class="brand-name">${b.brand}</div>
        <div class="brand-era">${b.era}</div>
      </div>
      <div class="car-grid"></div>
    `;
    const grid = block.querySelector('.car-grid');
    filteredCars.forEach((c, idx)=>{
      const card = document.createElement('div');
      card.className = 'car-card';
      const hasPhoto = c.images && c.images.front;
      const plateInner = hasPhoto
        ? `<img src="${commonsUrl(c.images.front, 300)}" alt="${b.brand} ${c.model}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.classList.add('img-failed'); this.style.display='none';">`
        : `<div class="plate-year">${c.year}</div>`;
      card.innerHTML = `
        <div class="car-plate" style="background:${plateGradient(b.brand, idx)}">
          ${plateInner}
        </div>
        <div class="car-info">
          <div class="car-model">${c.model}</div>
          <div class="car-year">${c.tag}</div>
        </div>
      `;
      card.onclick = ()=>openModal(b, c);
      grid.appendChild(card);
    });
    main.appendChild(block);
  });

  document.getElementById('archiveCount').innerHTML =
    `<span>Markalar: <b>${new Set(DATA.filter(b=>activeBrand==='all'||activeBrand===b.brand).map(b=>b.brand)).size}</b></span>
     <span>Otomobiller: <b>${visibleCount}</b></span>`;

  if(visibleCount===0){
    main.innerHTML = '<div class="empty-state">Bu filtrede henüz araba yok.</div>';
  }
}

function openModal(brand, car){
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  const noteKey = `note_${brand.brand}_${car.model}`.replace(/\s+/g,'_');
  const savedNote = window.__notes && window.__notes[noteKey] || '';

  const imgs = car.images || {};
  const slotHtml = (key, label, gradIdx) => {
    const file = imgs[key];
    const bg = `background:${plateGradient(brand.brand, gradIdx)}`;
    if(file){
      const thumbUrl = commonsUrl(file, 500);
      const fullUrl = commonsUrl(file, 1400);
      return `<div class="slot" style="${bg}" onclick="openLightbox('${fullUrl.replace(/'/g,"\\'")}', '${(brand.brand+' '+car.model+' — '+label).replace(/'/g,"\\'")}')">
        <img src="${thumbUrl}" alt="${brand.brand} ${car.model} ${label}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';">
        <span class="slot-label" style="position:relative;z-index:1;">${label}</span>
        <span class="zoom-hint">⤢</span>
      </div>`;
    }
    return `<div class="slot" style="${bg}"><span class="slot-label">${label} — YAKINDA</span></div>`;
  };

  content.innerHTML = `
    <div class="modal-close"><button onclick="closeModal()">✕</button></div>
    <div class="modal-hero">
      <div class="photo-slots">
        ${slotHtml('front','ÖN GÖRÜNÜM',0).replace('class="slot"','class="slot slot-main"')}
        ${slotHtml('side','YAN GÖRÜNÜM',1)}
        ${slotHtml('interior','İÇ MEKAN',2)}
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-eyebrow">${brand.brand} · ${car.tag}</div>
      <div class="modal-title">${car.model}</div>
      <div class="modal-sub">${car.year} · ${brand.region}</div>

      <div class="spec-plate">
        <div class="spec-item"><div class="k">Tasarımcı</div><div class="v">${car.designer}</div></div>
        <div class="spec-item"><div class="k">Motor</div><div class="v">${car.engine}</div></div>
        <div class="spec-item"><div class="k">Üretim Yılı</div><div class="v">${car.year}</div></div>
        <div class="spec-item"><div class="k">Marka Dönemi</div><div class="v">${brand.era}</div></div>
        ${car.topSpeed ? `<div class="spec-item"><div class="k">Maks. Hız</div><div class="v">${car.topSpeed}</div></div>` : ''}
        ${car.power ? `<div class="spec-item"><div class="k">Beygir Gücü</div><div class="v">${car.power}</div></div>` : ''}
        ${car.zeroToHundred ? `<div class="spec-item"><div class="k">0-100 km/s</div><div class="v">${car.zeroToHundred}</div></div>` : ''}
        ${car.production ? `<div class="spec-item"><div class="k">Üretim Adedi</div><div class="v">${car.production}</div></div>` : ''}
      </div>

      ${car.story2 ? `<p class="story">${car.story}</p><p class="story">${car.story2}</p>` : `<p class="story">${car.story}</p>`}

      <div class="section-label">Benzer Modeller</div>
      <div class="similar-row">
        ${car.similar.map(s=>`<div class="similar-chip" onclick="jumpTo('${brand.brand}','${s}')">${s}</div>`).join('')}
      </div>

      <div class="section-label">Notlarım</div>
      <div class="note-box">
        <textarea placeholder="Bu arabaya dair bir anın mı var? Buraya yazabilirsin..." id="noteArea">${savedNote}</textarea>
        <div class="note-hint">Not: bu prototipte notlar kalıcı kaydedilmiyor — canlı sürümde saklanacak.</div>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  overlay.scrollTop = 0;
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

function jumpTo(brandName, modelName){
  const brand = DATA.find(b=>b.brand===brandName);
  if(!brand) return;
  const car = brand.cars.find(c=>c.model===modelName);
  if(!car) return;
  openModal(brand, car);
}

function openLightbox(url, caption){
  const img = document.getElementById('lightboxImg');
  img.style.opacity = '0.3';
  img.src = url;
  img.onload = ()=>{ img.style.opacity = '1'; };
  document.getElementById('lightboxCaption').textContent = caption;
  document.getElementById('lightboxOverlay').classList.add('open');
}

function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

renderFilters();
renderMain();
</script>
</body>
</html>
