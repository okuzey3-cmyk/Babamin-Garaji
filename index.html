<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Babamın Garajı">
<meta name="theme-color" content="#141B15">
<title>Babamın Garajı — Klasik Otomobil Arşivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://commons.wikimedia.org">
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="dns-prefetch" href="https://upload.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#141B15;
    --bg-panel:#1D2620;
    --bg-panel-2:#232E27;
    --brass:#BB9A4B;
    --brass-bright:#D9BC72;
    --oxblood:#7C2F2A;
    --oxblood-bright:#A5453D;
    --cream:#EFE6D2;
    --muted:#93A090;
    --chrome:#5C665C;
    --line:#33402F;
  }
  [data-theme="light"]{
    --bg-deep:#F4F0E6;
    --bg-panel:#FFFFFF;
    --bg-panel-2:#EDE7D8;
    --brass:#9C7B2E;
    --brass-bright:#7A5F1F;
    --oxblood:#8C3B34;
    --oxblood-bright:#A5453D;
    --cream:#231F16;
    --muted:#6B6656;
    --chrome:#8A8470;
    --line:#DCD4BE;
  }
  [data-theme="light"] body::before{opacity:0.15;}
  [data-theme="light"] .car-plate::after{color:rgba(35,31,22,0.55);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-deep);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--brass);color:#141B15;}

  /* texture */
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    opacity:0.5;
  }

  header{
    position:relative;z-index:1;
    padding:38px 20px 26px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(ellipse at 50% -20%, rgba(187,154,75,0.10), transparent 60%),
      var(--bg-deep);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.28em;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:42px;
    letter-spacing:0.03em;
    margin:8px 0 6px;
    color:var(--cream);
    text-transform:uppercase;
  }
  h1 span{
    background:linear-gradient(90deg,
      var(--brass) 0%, var(--brass) 30%,
      #F5E6C8 45%, #FFFBEF 50%, #F5E6C8 55%,
      var(--brass-bright) 70%, var(--brass) 100%);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:var(--brass-bright); /* background-clip desteklemeyen tarayıcılar için yedek */
    animation:titleShine 4s ease-in-out infinite, titleGlow 2s ease-in-out infinite;
  }
  @keyframes titleShine{
    0%{background-position:220% center;}
    55%{background-position:-40% center;}
    100%{background-position:-40% center;}
  }
  @keyframes titleGlow{
    0%,100%{filter:drop-shadow(0 0 0px rgba(217,188,114,0));}
    50%{filter:drop-shadow(0 0 12px rgba(217,188,114,0.65)) drop-shadow(0 0 24px rgba(217,188,114,0.25));}
  }
  @media (prefers-reduced-motion: reduce){
    h1 span{animation:none; background:none; -webkit-text-fill-color:var(--brass-bright); filter:none;}
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    max-width:440px;
    margin:0 auto;
    line-height:1.5;
  }
  .archive-count{
    margin-top:16px;
    display:inline-flex;
    gap:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass);
    border:1px solid var(--line);
    padding:8px 16px;
    border-radius:2px;
    background:var(--bg-panel);
  }
  .archive-count b{color:var(--cream);font-weight:600;}

  .toolbar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .tb-btn{
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--cream);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:7px 11px;
    border-radius:4px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .tb-btn:hover, .tb-btn:active{border-color:var(--brass);color:var(--brass-bright);}
  .tb-fontgroup{display:flex;gap:2px;background:var(--bg-panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .tb-fontgroup .tb-btn{border:none;border-radius:0;border-right:1px solid var(--line);}
  .tb-fontgroup .tb-btn:last-child{border-right:none;}

  #todayCarBanner{max-width:600px;margin:0 auto 14px;padding:0 16px;}
  .today-card{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-panel);
    border:1px solid var(--brass);
    border-radius:4px;
    padding:12px 14px;
    cursor:pointer;
  }
  .today-card:hover{background:var(--bg-panel-2);}
  .today-swatch{width:44px;height:44px;border-radius:4px;flex-shrink:0;}
  .today-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-bright);letter-spacing:0.06em;text-transform:uppercase;}
  .today-name{font-family:'Oswald',sans-serif;font-size:15px;color:var(--cream);margin-top:2px;}

  #recentStrip{max-width:600px;margin:0 auto 10px;padding:0 16px;}
  .recent-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .recent-chip{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 12px 5px 5px;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }
  .recent-chip:hover{border-color:var(--brass);color:var(--cream);}
  .recent-chip-swatch{width:20px;height:20px;border-radius:50%;flex-shrink:0;}

  .search-mic{
    background:none;border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
    flex-shrink:0;
  }
  .search-mic:hover{color:var(--brass);}
  .search-mic.listening{color:var(--oxblood-bright); animation:micPulse 1s ease-in-out infinite;}
  @keyframes micPulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .pron-btn{
    background:none;border:none;
    color:var(--muted);
    font-size:14px;
    cursor:pointer;
    margin-left:6px;
    vertical-align:middle;
  }
  .pron-btn:hover{color:var(--brass-bright);}

  .modal-action-row{display:flex;gap:8px;margin:10px 0 16px;}
  .modal-action-btn{
    flex:1;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--cream);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:9px 10px;
    border-radius:4px;
    cursor:pointer;
  }
  .modal-action-btn:hover{border-color:var(--brass);color:var(--brass-bright);}

  .stats-overlay{
    position:fixed;inset:0;z-index:90;
    background:rgba(10,14,11,0.88);
    display:none;
    align-items:flex-start;justify-content:center;
    overflow-y:auto;
    padding:20px 16px;
  }
  .stats-overlay.open{display:flex;}
  .stats-panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:6px;
    max-width:520px;width:100%;
    padding:20px;
  }
  .stats-panel h2{
    font-family:'Oswald',sans-serif;
    font-size:22px;color:var(--cream);
    margin:0 0 4px;text-transform:uppercase;
  }
  .stats-close{float:right;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--cream);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;}
  .stat-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .stat-row:hover .stat-value{color:var(--brass-bright);}
  .stat-row:last-child{border-bottom:none;}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
  .stat-value{font-family:'Oswald',sans-serif;font-size:15px;color:var(--cream);margin-top:3px;}
  .stat-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);}

  @media print{
    header, .search-wrap, .filters, #regionFilters, #todayCarBanner, #recentStrip, footer,
    .modal-close, .video-link, .search-web-item, .note-box, .similar-row, .section-label:has(+ .similar-row){
      display:none !important;
    }
    body{background:#fff;color:#111;}
    .modal-overlay{position:static;background:#fff;display:block !important;}
    .modal{max-width:100%;border:none;}
  }

  .search-wrap{
    position:relative;
    max-width:600px;
    margin:0 auto;
    padding:0 16px 14px;
    z-index:6;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 14px;
    transition:border-color .15s ease;
  }
  .search-box:focus-within{border-color:var(--brass);}
  .search-icon{font-size:15px;opacity:0.7;flex-shrink:0;}
  #searchInput{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:15px;
  }
  #searchInput::placeholder{color:var(--muted);}
  .search-clear{
    background:none;border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
    flex-shrink:0;
  }
  .search-clear:hover{color:var(--cream);}

  .search-results{
    position:absolute;
    top:100%;left:16px;right:16px;
    margin-top:6px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    max-height:70vh;
    overflow-y:auto;
    display:none;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .search-results.open{display:block;}

  .search-hint{
    padding:12px 16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass);
    border-bottom:1px solid var(--line);
    background:var(--bg-panel-2);
  }
  .search-hint b{color:var(--brass-bright);}

  .search-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .12s ease;
  }
  .search-item:last-child{border-bottom:none;}
  .search-item:hover, .search-item:active{background:var(--bg-panel-2);}
  .search-item-swatch{
    width:34px;height:34px;
    border-radius:3px;
    flex-shrink:0;
  }
  .search-item-text{flex:1;min-width:0;}
  .search-item-model{
    font-family:'Oswald',sans-serif;
    font-size:14.5px;
    color:var(--cream);
    font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .search-item-brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
  }

  .search-web-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    cursor:pointer;
    color:var(--brass-bright);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    background:var(--bg-panel-2);
  }
  .search-web-item:hover{background:var(--bg-deep);}
  .search-empty{
    padding:16px;
    text-align:center;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }

  .web-image-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    padding:10px 16px 14px;
  }
  .web-thumb-wrap{
    aspect-ratio:1/1;
    border-radius:3px;
    overflow:hidden;
    cursor:zoom-in;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
  }
  .web-thumb{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }

  /* filters */
  .filters{
    position:sticky;top:0;z-index:5;
    background:rgba(20,27,21,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.04em;
    padding:7px 14px;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--bg-panel);
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--brass);color:var(--cream);}
  .chip.active{background:var(--brass);color:#141B15;border-color:var(--brass);font-weight:600;}

  main{position:relative;z-index:1;padding:24px 16px 80px;max-width:1100px;margin:0 auto;}

  .brand-block{margin-bottom:44px;}
  .brand-block[hidden]{display:none;}
  .brand-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding-bottom:10px;
    margin-bottom:16px;
    border-bottom:2px solid var(--brass);
  }
  .brand-name{
    font-family:'Oswald',sans-serif;
    font-size:24px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:var(--cream);
  }
  .brand-era{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:2px;
  }

  .car-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
  }

  .car-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease;
    display:flex;flex-direction:column;
  }
  .car-card:hover{transform:translateY(-3px);border-color:var(--brass);}
  .car-card:active{transform:translateY(-1px);}

  .car-plate{
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .car-plate::after{
    content:"FOTOĞRAF EKLENECEK";
    position:absolute;
    bottom:8px;left:8px;right:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:8px;
    letter-spacing:0.08em;
    color:rgba(239,230,210,0.55);
    text-align:left;
  }
  .car-plate .plate-year{
    font-family:'Oswald',sans-serif;
    font-size:34px;
    font-weight:700;
    color:rgba(239,230,210,0.85);
    letter-spacing:0.02em;
  }

  .car-info{padding:10px 12px 12px;}
  .car-model{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--cream);
    line-height:1.25;
    margin-bottom:4px;
  }
  .car-year{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--brass);
  }

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(10,14,11,0.88);
    display:none;
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    padding:0;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-panel);
    width:100%;
    max-width:640px;
    min-height:100vh;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  @media(min-width:680px){
    .modal-overlay{padding:40px 20px;}
    .modal{min-height:auto;border-radius:4px;}
  }
  .modal-close{
    position:sticky;top:0;z-index:2;
    display:flex;justify-content:flex-end;
    padding:14px 14px 0;
  }
  .modal-close button{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--cream);
    width:34px;height:34px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
  }
  .modal-hero{
    padding:0 20px;
    margin-top:-4px;
  }
  .photo-slots{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:130px 130px;
    gap:6px;
  }
  .photo-slots .slot-main{grid-row:span 2;}
  .slot{
    border-radius:3px;
    display:flex;align-items:flex-end;
    padding:8px;
    position:relative;
    overflow:hidden;
  }
  .car-plate{position:relative;}
  .slot-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    letter-spacing:0.1em;
    color:rgba(239,230,210,0.7);
    background:rgba(10,14,11,0.4);
    padding:2px 6px;
    border-radius:2px;
  }

  .modal-body{padding:20px;}
  .modal-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.15em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .modal-title{
    font-family:'Oswald',sans-serif;
    font-size:28px;
    font-weight:700;
    margin:6px 0 2px;
    color:var(--cream);
    text-transform:uppercase;
  }
  .modal-sub{color:var(--muted);font-size:13px;margin-bottom:18px;}

  .spec-plate{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
    margin-bottom:20px;
  }
  .spec-item .k{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .spec-item .v{font-size:13px;color:var(--cream);margin-top:2px;}

  .modal-body p.story{
    font-size:14.5px;
    line-height:1.7;
    color:#DAD2BE;
    margin-bottom:18px;
  }

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--brass);
    text-transform:uppercase;
    margin-bottom:10px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }

  .similar-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .similar-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:2px;
    color:var(--cream);
    cursor:pointer;
    background:var(--bg-deep);
  }
  .similar-chip:hover{border-color:var(--brass);color:var(--brass-bright);}

  .note-box{
    margin-top:8px;
  }
  .note-box textarea{
    width:100%;
    min-height:70px;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:10px;
    resize:vertical;
  }
  .note-box textarea:focus{outline:none;border-color:var(--brass);}
  .note-hint{font-size:11px;color:var(--muted);margin-top:6px;}

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--chrome);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  .zoom-hint{
    position:absolute;
    top:8px;right:8px;
    z-index:2;
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(10,14,11,0.55);
    color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;

// Flatten
const ALL = [];
DATA.forEach(b=>b.cars.forEach(c=>ALL.push({...c, brand:b.brand, brandEra:b.era, region:b.region})));

// ---- Arama motoru: normalize + yazım hatası toleranslı eşleştirme ----
function normalizeTr(str){
  return str.toLowerCase()
    .replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function levenshtein(a, b){
  if(a===b) return 0;
  if(a.length===0) return b.length;
  if(b.length===0) return a.length;
  const matrix = [];
  for(let i=0;i<=b.length;i++) matrix[i] = [i];
  for(let j=0;j<=a.length;j++) matrix[0][j] = j;
  for(let i=1;i<=b.length;i++){
    for(let j=1;j<=a.length;j++){
      if(b.charAt(i-1)===a.charAt(j-1)){
        matrix[i][j] = matrix[i-1][j-1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i-1][j-1]+1,
          matrix[i][j-1]+1,
          matrix[i-1][j]+1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

function buildDescriptionHaystack(car){
  return normalizeTr([car.brand, car.model, car.tag, car.region, car.engine, car.story, car.story2 || ''].filter(Boolean).join(' '));
}

// Anlam/tarif tabanlı arama: kullanıcı marka/model adını değil, arabayı betimleyen
// kelimeleri yazdığında (örn. "kelebek kapılı", "İtalyan spor araba") hikaye ve
// etiket metinlerinde bu kelimeleri arayıp en çok eşleşen arabaları önerir.
const STOPWORDS = new Set(['bir','bu','şu','ve','ile','the','a','an','araba','arac','otomobil','klasik','model','marka']);
function searchDescribed(qWords, limit){
  const meaningfulWords = qWords.filter(w => w.length >= 3 && !STOPWORDS.has(w));
  if(meaningfulWords.length === 0) return [];

  const results = [];
  ALL.forEach(car=>{
    const hay = buildDescriptionHaystack(car);
    const hWords = hay.split(' ');
    let matchCount = 0;
    meaningfulWords.forEach(qw=>{
      if(hay.includes(qw)){ matchCount++; return; }
      for(const hw of hWords){
        if(hw.length < 3) continue;
        const threshold = qw.length <= 5 ? 1 : 2;
        if(levenshtein(qw, hw) <= threshold){ matchCount++; return; }
      }
    });
    if(matchCount > 0) results.push({car, matchCount});
  });

  results.sort((a,b)=> b.matchCount - a.matchCount);
  return results.slice(0, limit);
}

function searchCars(query){
  const q = normalizeTr(query);
  if(q.length < 2) return {exact:[], fuzzy:[], described:[]};
  const qWords = q.split(' ').filter(Boolean);

  const exact = [];
  const fuzzy = [];

  ALL.forEach(car=>{
    const haystack = normalizeTr(car.brand + ' ' + car.model);
    if(haystack.includes(q)){
      exact.push({car, score:0});
      return;
    }
    // Kelime kelime yazım hatası toleranslı kontrol
    const hWords = haystack.split(' ');
    let bestWordDist = Infinity;
    qWords.forEach(qw=>{
      hWords.forEach(hw=>{
        if(hw.length < 2) return;
        const d = levenshtein(qw, hw);
        const threshold = qw.length <= 4 ? 1 : (qw.length <= 7 ? 2 : 3);
        if(d <= threshold && d < bestWordDist) bestWordDist = d;
      });
    });
    if(bestWordDist < Infinity){
      fuzzy.push({car, score: bestWordDist});
    }
  });

  exact.sort((a,b)=>a.car.brand.localeCompare(b.car.brand));
  fuzzy.sort((a,b)=>a.score-b.score);

  // İsimde ne tam ne de yaklaşık bir eşleşme yoksa, kullanıcı muhtemelen arabayı
  // "tarif etmeye" çalışıyordur — hikaye ve etiket metinlerinde arıyoruz.
  let described = [];
  if(exact.length === 0 && fuzzy.length === 0){
    described = searchDescribed(qWords, 6);
  }

  return {exact: exact.slice(0,8), fuzzy: fuzzy.slice(0,5), described};
}

function webSearchUrl(query){
  return "https://www.google.com/search?q=" + encodeURIComponent(query + " araba klasik otomobil");
}

// Wikimedia Commons'ın herkese açık, ücretsiz arama API'si — arşivimizdeki 363 arabayla
// sınırlı kalmadan, yazılan HERHANGİ bir şey için gerçek fotoğraf çeker.
let commonsSearchToken = 0;
async function fetchCommonsThumbnails(query, limit){
  const url = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6"
    + "&gsrsearch=" + encodeURIComponent(query + " car")
    + "&gsrlimit=" + limit
    + "&prop=imageinfo&iiprop=url&iiurlwidth=300&format=json&origin=*";
  try {
    const res = await fetch(url);
    if(!res.ok) return [];
    const data = await res.json();
    if(!data.query || !data.query.pages) return [];
    return Object.values(data.query.pages)
      .filter(p => p.imageinfo && p.imageinfo[0])
      .map(p => ({
        title: p.title.replace(/^File:/,'').replace(/\.(jpg|jpeg|png)$/i,''),
        thumb: p.imageinfo[0].thumburl,
        full: p.imageinfo[0].url
      }));
  } catch(e){
    return [];
  }
}

function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  const clearBtn = document.getElementById('searchClear');
  clearBtn.style.display = query ? 'block' : 'none';

  if(!query || query.trim().length < 2){
    box.classList.remove('open');
    box.innerHTML = '';
    return;
  }

  const {exact, fuzzy, described} = searchCars(query);
  let html = '';

  if(exact.length > 0){
    html += `<div class="search-hint">📚 Garajımızdaki arabalar</div>`;
    html += exact.map(({car}, idx)=>{
      const bg = plateGradient(car.brand, idx);
      return `<div class="search-item" onclick="selectSearchResult('${car.brand.replace(/'/g,"\\'")}','${car.model.replace(/'/g,"\\'")}')">
        <div class="search-item-swatch" style="background:${bg}"></div>
        <div class="search-item-text">
          <div class="search-item-model">${car.model}</div>
          <div class="search-item-brand">${car.brand} · ${car.year}</div>
        </div>
      </div>`;
    }).join('');
  } else if(fuzzy.length > 0){
    html += `<div class="search-hint">'<b>${query}</b>' için garajımızda tam eşleşme yok. Bunlardan birini mi demek istediniz?</div>`;
    html += fuzzy.map(({car}, idx)=>{
      const bg = plateGradient(car.brand, idx);
      return `<div class="search-item" onclick="selectSearchResult('${car.brand.replace(/'/g,"\\'")}','${car.model.replace(/'/g,"\\'")}')">
        <div class="search-item-swatch" style="background:${bg}"></div>
        <div class="search-item-text">
          <div class="search-item-model">${car.model}</div>
          <div class="search-item-brand">${car.brand} · ${car.year}</div>
        </div>
      </div>`;
    }).join('');
  } else if(described.length > 0){
    html += `<div class="search-hint">İsimde eşleşme bulamadık, ama tarifine uyan arabalar bunlar olabilir — <b>bunu mu demek istediniz?</b></div>`;
    html += described.map(({car}, idx)=>{
      const bg = plateGradient(car.brand, idx);
      return `<div class="search-item" onclick="selectSearchResult('${car.brand.replace(/'/g,"\\'")}','${car.model.replace(/'/g,"\\'")}')">
        <div class="search-item-swatch" style="background:${bg}"></div>
        <div class="search-item-text">
          <div class="search-item-model">${car.model}</div>
          <div class="search-item-brand">${car.brand} · ${car.year} · ${car.tag}</div>
        </div>
      </div>`;
    }).join('');
  } else {
    html += `<div class="search-empty">Garajımızda '${query}' ile eşleşen bir araba yok — aşağıda web'den bulunanlara bakabilirsin.</div>`;
  }

  html += `<div id="webImagesSection">
    <div class="search-hint">🌍 Web'den bulunan görseller — <span id="webImagesStatus">aranıyor...</span></div>
  </div>`;

  html += `<div class="search-web-item" onclick="openWebSearch('${query.replace(/'/g,"\\'")}')">
    <span>🌐</span><span>'${query}' için internette geniş arama yap</span>
  </div>`;

  box.innerHTML = html;
  box.classList.add('open');

  // Wikimedia Commons'tan canlı görsel çekiyoruz (arşivde olsun olmasın, her arama için)
  const myToken = ++commonsSearchToken;
  fetchCommonsThumbnails(query, 6).then(images=>{
    if(myToken !== commonsSearchToken) return; // kullanıcı arada başka bir şey aradı, bu sonuç eskidi
    const section = document.getElementById('webImagesSection');
    if(!section) return;
    if(images.length === 0){
      section.innerHTML = `<div class="search-hint">🌍 Web'den görsel bulunamadı</div>`;
      return;
    }
    section.innerHTML = `<div class="search-hint">🌍 Web'den bulunan görseller</div>
      <div class="web-image-grid">
        ${images.map(img => `<div class="web-thumb-wrap" onclick="openLightbox('${img.full.replace(/'/g,"\\'")}','${img.title.replace(/'/g,"\\'")}')">
          <img src="${img.thumb}" alt="${img.title}" loading="lazy" class="web-thumb">
        </div>`).join('')}
      </div>`;
  });
}

function selectSearchResult(brandName, modelName){
  const brandObj = DATA.find(b=>b.brand===brandName);
  if(!brandObj) return;
  const carObj = brandObj.cars.find(c=>c.model===modelName);
  if(!carObj) return;
  clearSearch();
  openModal(brandObj, carObj);
}

function openWebSearch(query){
  window.open(webSearchUrl(query), '_blank', 'noopener,noreferrer');
}

function clearSearch(){
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchResults').classList.remove('open');
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchClear').style.display = 'none';
}

let searchDebounce;
const searchInputEl = document.getElementById('searchInput');
if(searchInputEl){
  searchInputEl.addEventListener('input', (e)=>{
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(()=>renderSearchResults(val), 250);
  });

const eraGroups = [
  {id:"all", label:"Tümü"},
  {id:"10s20s", label:"1910–29", test:y=>y<1930},
  {id:"30s", label:"1930'lar", test:y=>y>=1930&&y<1940},
  {id:"40s", label:"1940'lar", test:y=>y>=1940&&y<1950},
  {id:"50s", label:"1950'ler", test:y=>y>=1950&&y<1960},
  {id:"60s", label:"1960'lar", test:y=>y>=1960&&y<1970},
  {id:"70s", label:"1970'ler", test:y=>y>=1970&&y<1980},
  {id:"80s", label:"1980'ler", test:y=>y>=1980}
];

function commonsUrl(filename, width){
  const base = "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(filename);
  return width ? base + "?width=" + width : base;
}

function videoSearchUrl(brand, model, year){
  const q = `${brand} ${model} ${year} classic car`;
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
}

function handleImgError(img, filename, width){
  if(!img.dataset.retried){
    // İlk deneme başarısız oldu; aynı (küçük) boyutta bir kez daha dene —
    // genelde geçici ağ sorunu olur, tam boyuta geçmek daha da yavaşlatır
    img.dataset.retried = '1';
    const sep = commonsUrl(filename, width).includes('?') ? '&' : '?';
    img.src = commonsUrl(filename, width) + sep + 'retry=' + Date.now();
  } else {
    // İkinci deneme de başarısız oldu; görseli tamamen gizle, altındaki renkli plaka görünsün
    img.style.display = 'none';
    if(img.parentElement) img.parentElement.classList.add('img-failed');
  }
}

function armImageTimeout(img, ms){
  // Bazı ağlarda görsel isteği ne başarılı ne başarısız olarak sonuçlanmadan asılı kalabilir.
  // Belirtilen süre içinde yüklenmezse, başarısız kabul edip düşür.
  const timer = setTimeout(()=>{
    if(!img.complete || img.naturalWidth===0){
      img.dispatchEvent(new Event('error'));
    }
  }, ms);
  img.addEventListener('load', ()=>clearTimeout(timer), {once:true});
}

function renderFilters(){
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  eraGroups.forEach(e=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeEra===e.id ? ' active':'');
    chip.textContent = e.label;
    chip.onclick = ()=>{ activeEra = e.id; renderFilters(); renderMain(); };
    wrap.appendChild(chip);
  });
  const divider = document.createElement('div');
  divider.style.cssText = 'width:1px;background:var(--line);margin:0 4px;flex:0 0 auto;';
  wrap.appendChild(divider);

  const allBrandChip = document.createElement('div');
  allBrandChip.className = 'chip' + (activeBrand==='all' ? ' active':'');
  allBrandChip.textContent = 'Tüm Markalar';
  allBrandChip.onclick = ()=>{ activeBrand='all'; renderFilters(); renderMain(); };
  wrap.appendChild(allBrandChip);

  DATA.forEach(b=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeBrand===b.brand ? ' active':'');
    chip.textContent = b.brand;
    chip.onclick = ()=>{ activeBrand = b.brand; renderFilters(); renderMain(); };
    wrap.appendChild(chip);
  });

  renderRegionFilters();
}

function renderRegionFilters(){
  const wrap = document.getElementById('regionFilters');
  if(!wrap) return;
  wrap.innerHTML = '';
  const regions = Array.from(new Set(DATA.map(b=>b.region))).sort((a,b)=>a.localeCompare(b));

  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeRegion==='all' ? ' active':'');
  allChip.textContent = '🌍 Tüm Ülkeler';
  allChip.onclick = ()=>{ activeRegion='all'; renderRegionFilters(); renderMain(); };
  wrap.appendChild(allChip);

  regions.forEach(r=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeRegion===r ? ' active':'');
    chip.textContent = r;
    chip.onclick = ()=>{ activeRegion = r; renderRegionFilters(); renderMain(); };
    wrap.appendChild(chip);
  });
}

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const eraDef = eraGroups.find(e=>e.id===activeEra);
  let visibleCount = 0;

  DATA.forEach(b=>{
    if(activeBrand!=='all' && activeBrand!==b.brand) return;
    if(activeRegion!=='all' && activeRegion!==b.region) return;
    const filteredCars = b.cars.filter(c => eraDef.id==='all' ? true : eraDef.test(c.year));
    if(filteredCars.length===0) return;
    visibleCount += filteredCars.length;

    const block = document.createElement('div');
    block.className = 'brand-block';
    block.innerHTML = `
      <div class="brand-head">
        <div class="brand-name">${b.brand}</div>
        <div class="brand-era">${b.era}</div>
      </div>
      <div class="car-grid"></div>
    `;
    const grid = block.querySelector('.car-grid');
    filteredCars.forEach((c, idx)=>{
      const card = document.createElement('div');
      card.className = 'car-card';
      const hasPhoto = c.images && c.images.front;
      const frontFileEsc = hasPhoto ? c.images.front.replace(/'/g,"\\'") : '';
      const cardImgId = 'img_' + b.brand.replace(/[^a-zA-Z0-9]/g,'') + '_' + c.model.replace(/[^a-zA-Z0-9]/g,'') + '_' + idx;
      const plateInner = hasPhoto
        ? `<img id="${cardImgId}" src="${commonsUrl(c.images.front, 300)}" alt="${b.brand} ${c.model}" loading="lazy" decoding="async" class="fade-img" style="width:100%;height:100%;object-fit:cover;" onload="this.classList.add('loaded')" onerror="handleImgError(this,'${frontFileEsc}',300)">`
        : `<div class="plate-year">${c.year}</div>`;
      card.innerHTML = `
        <div class="car-plate" style="background:${plateGradient(b.brand, idx)}">
          ${plateInner}
        </div>
        <div class="car-info">
          <div class="car-model">${c.model}</div>
          <div class="car-year">${c.tag}</div>
        </div>
      `;
      card.onclick = ()=>openModal(b, c);
      grid.appendChild(card);
      if(hasPhoto){
        const imgEl = document.getElementById(cardImgId);
        if(imgEl) armImageTimeout(imgEl, 7000);
      }
    });
    main.appendChild(block);
  });

  document.getElementById('archiveCount').innerHTML =
    `<span>Markalar: <b>${new Set(DATA.filter(b=>(activeBrand==='all'||activeBrand===b.brand)&&(activeRegion==='all'||activeRegion===b.region)).map(b=>b.brand)).size}</b></span>
     <span>Otomobiller: <b>${visibleCount}</b></span>`;

  if(visibleCount===0){
    main.innerHTML = '<div class="empty-state">Bu filtrede henüz araba yok.</div>';
  }
}

        <button class="modal-action-btn" onclick="window.print()">🖨️ Yazdır</button>
      </div>

      <div class="spec-plate">
        <div class="spec-item"><div class="k">Tasarımcı</div><div class="v">${car.designer}</div></div>
        <div class="spec-item"><div class="k">Motor</div><div class="v">${car.engine}</div></div>
        <div class="spec-item"><div class="k">Üretim Yılı</div><div class="v">${car.year}</div></div>
        <div class="spec-item"><div class="k">Marka Dönemi</div><div class="v">${brand.era}</div></div>
        ${car.topSpeed ? `<div class="spec-item"><div class="k">Maks. Hız</div><div class="v">${car.topSpeed}</div></div>` : ''}
        ${car.power ? `<div class="spec-item"><div class="k">Beygir Gücü</div><div class="v">${car.power}</div></div>` : ''}
        ${car.zeroToHundred ? `<div class="spec-item"><div class="k">0-100 km/s</div><div class="v">${car.zeroToHundred}</div></div>` : ''}
        ${car.production ? `<div class="spec-item"><div class="k">Üretim Adedi</div><div class="v">${car.production}</div></div>` : ''}
      </div>

      ${car.story2 ? `<p class="story">${car.story}</p><p class="story">${car.story2}</p>` : `<p class="story">${car.story}</p>`}

      <div class="section-label">Benzer Modeller</div>
      <div class="similar-row">
        ${car.similar.map(s=>`<div class="similar-chip" onclick="jumpTo('${brand.brand}','${s}')">${s}</div>`).join('')}
      </div>

      <div class="section-label">Notlarım</div>
      <div class="note-box">
        <textarea placeholder="Bu arabaya dair bir anın mı var? Buraya yazabilirsin..." id="noteArea">${savedNote}</textarea>
        <div class="note-hint">Not: bu prototipte notlar kalıcı kaydedilmiyor — canlı sürümde saklanacak.</div>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  overlay.scrollTop = 0;
  content.querySelectorAll('.fade-img').forEach(img => armImageTimeout(img, 7000));

  addToRecentlyViewed(brand.brand, car.model);
  try{ history.replaceState(null, '', '#' + encodeURIComponent(brand.brand) + '|' + encodeURIComponent(car.model)); }catch(e){}
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
}

function jumpTo(brandName, modelName){
  const brand = DATA.find(b=>b.brand===brandName);
  if(!brand) return;
  const car = brand.cars.find(c=>c.model===modelName);
  if(!car) return;
  openModal(brand, car);
}

function openLightbox(url, caption){
  const img = document.getElementById('lightboxImg');
  img.style.opacity = '0.3';
  img.src = url;
  img.onload = ()=>{ img.style.opacity = '1'; };
  document.getElementById('lightboxCaption').textContent = caption;
  document.getElementById('lightboxOverlay').classList.add('open');
}

function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

// ---- Açık/Koyu Tema ----
function applySavedTheme(){
  const saved = localStorage.getItem('garaj_theme');
  if(saved === 'light'){ document.documentElement.setAttribute('data-theme','light'); }
}
function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(isLight){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('garaj_theme','dark');
  } else {
    document.documentElement.setAttribute('data-theme','light');
    localStorage.setItem('garaj_theme','light');
  }
}

// ---- Yazı Boyutu ----
let currentFontScale = parseFloat(localStorage.getItem('garaj_fontscale') || '1');
function applySavedFontScale(){
  document.body.style.zoom = currentFontScale;
}
function changeFontScale(direction){
  if(direction === 0){ currentFontScale = 1; }
  else { currentFontScale = Math.min(1.4, Math.max(0.85, currentFontScale + direction*0.1)); }
  document.body.style.zoom = currentFontScale;
  localStorage.setItem('garaj_fontscale', String(currentFontScale));
}

// ---- Marka/model sesli okuma ----
function speakText(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

// ---- Sesli arama ----
function startVoiceSearch(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const recognition = new SR();
  recognition.lang = 'tr-TR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  const micBtn = document.getElementById('searchMic');
  micBtn.classList.add('listening');
  recognition.onresult = (event)=>{
    const said = event.results[0][0].transcript;
    const input = document.getElementById('searchInput');
    input.value = said;
    renderSearchResults(said);
  };
  recognition.onend = ()=>{ micBtn.classList.remove('listening'); };
  recognition.onerror = ()=>{ micBtn.classList.remove('listening'); };
  recognition.start();
}
function initVoiceSearchButton(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('searchMic');
  if(SR && micBtn) micBtn.style.display = 'block';
}

// ---- Paylaşım ----
function shareCar(brandName, modelName){
  const url = location.origin + location.pathname + '#' + encodeURIComponent(brandName) + '|' + encodeURIComponent(modelName);
  const shareData = { title: `${brandName} ${modelName} — Babamın Garajı`, url };
  if(navigator.share){
    navigator.share(shareData).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>{
      alert('Bağlantı kopyalandı — istediğin yere yapıştırabilirsin.');
    }).catch(()=>{});
  }
}

// ---- Derin link: sayfa hash ile açıldıysa ilgili arabayı göster ----
function openFromHash(){
  if(!location.hash) return;
  const raw = location.hash.slice(1);
  const parts = raw.split('|').map(p=>{ try{ return decodeURIComponent(p); }catch(e){ return p; } });
  if(parts.length !== 2) return;
  const brandObj = DATA.find(b=>b.brand===parts[0]);
  if(!brandObj) return;
  const carObj = brandObj.cars.find(c=>c.model===parts[1]);
  if(!carObj) return;
  openModal(brandObj, carObj);
}

// ---- Rekorlar & İstatistikler ----
function parseLeadingNumber(str){
  if(!str) return null;
  const m = String(str).replace(/\./g,'').match(/[\d]+/);
  return m ? parseInt(m[0], 10) : null;
}
function openStats(){
  const body = document.getElementById('statsBody');
  let fastest=null, oldest=null, newest=null, rarest=null, strongest=null;

  ALL.forEach(car=>{
    const ts = parseLeadingNumber(car.topSpeed);
    if(ts!==null && (!fastest || ts > fastest.val)) fastest = {val:ts, car};
    const pw = parseLeadingNumber(car.power);
    if(pw!==null && (!strongest || pw > strongest.val)) strongest = {val:pw, car};
    if(!oldest || car.year < oldest.car.year) oldest = {val:car.year, car};
    if(!newest || car.year > newest.car.year) newest = {val:car.year, car};
    const pr = parseLeadingNumber(car.production);
    if(pr!==null && (!rarest || pr < rarest.val)) rarest = {val:pr, car};
  });

  const rows = [];
  if(fastest) rows.push({label:'En Hızlı', val:`${fastest.car.brand} ${fastest.car.model}`, sub:`${fastest.val} km/s`, car:fastest.car});
  if(strongest) rows.push({label:'En Güçlü Motor', val:`${strongest.car.brand} ${strongest.car.model}`, sub:`${strongest.val} BG`, car:strongest.car});
  if(oldest) rows.push({label:'En Eski', val:`${oldest.car.brand} ${oldest.car.model}`, sub:`${oldest.car.year}`, car:oldest.car});
  if(newest) rows.push({label:'En Yeni', val:`${newest.car.brand} ${newest.car.model}`, sub:`${newest.car.year}`, car:newest.car});
  if(rarest) rows.push({label:'En Nadir (Üretim Adedi)', val:`${rarest.car.brand} ${rarest.car.model}`, sub:`${rarest.val} adet`, car:rarest.car});
  rows.push({label:'Toplam Marka', val:`${DATA.length}`, sub:'', car:null});
  rows.push({label:'Toplam Araba', val:`${ALL.length}`, sub:'', car:null});

  body.innerHTML = rows.map(r=>`
    <div class="stat-row" ${r.car ? `onclick="closeStats();selectSearchResult('${r.car.brand.replace(/'/g,"\\'")}','${r.car.model.replace(/'/g,"\\'")}')"` : ''}>
      <div>
        <div class="stat-label">${r.label}</div>
        <div class="stat-value">${r.val}</div>
      </div>
      <div class="stat-sub">${r.sub}</div>
    </div>
  `).join('');

  document.getElementById('statsOverlay').classList.add('open');
}
function closeStats(){
  document.getElementById('statsOverlay').classList.remove('open');
}

// ---- Son Bakılanlar ----
function getRecentlyViewed(){
  try{ return JSON.parse(localStorage.getItem('garaj_recent') || '[]'); }catch(e){ return []; }
}
function addToRecentlyViewed(brandName, modelName){
  let list = getRecentlyViewed().filter(r => !(r.brand===brandName && r.model===modelName));
  list.unshift({brand:brandName, model:modelName});
  list = list.slice(0, 6);
  localStorage.setItem('garaj_recent', JSON.stringify(list));
  renderRecentStrip();
}
function renderRecentStrip(){
  const wrap = document.getElementById('recentStrip');
  if(!wrap) return;
  const list = getRecentlyViewed();
  if(list.length === 0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<div class="recent-row">${list.map((r,idx)=>{
    const bg = plateGradient(r.brand, idx);
    return `<div class="recent-chip" onclick="selectSearchResult('${r.brand.replace(/'/g,"\\'")}','${r.model.replace(/'/g,"\\'")}')">
      <span class="recent-chip-swatch" style="background:${bg}"></span>
      <span>${r.model}</span>
    </div>`;
  }).join('')}</div>`;
}

// ---- Bugün Sana Bir Araba ----
function renderTodayCarBanner(){
  const wrap = document.getElementById('todayCarBanner');
  if(!wrap || ALL.length===0) return;
  const today = new Date();
  const seed = today.getFullYear()*372 + today.getMonth()*31 + today.getDate();
  const idx = seed % ALL.length;
  const car = ALL[idx];
  const bg = plateGradient(car.brand, idx);
  wrap.innerHTML = `<div class="today-card" onclick="selectSearchResult('${car.brand.replace(/'/g,"\\'")}','${car.model.replace(/'/g,"\\'")}')">
    <div class="today-swatch" style="background:${bg}"></div>
    <div>
      <div class="today-label">Bugün Sana Bir Araba</div>
      <div class="today-name">${car.brand} ${car.model} (${car.year})</div>
    </div>
  </div>`;
}

// ---- Klavye kısayolları ----
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const lightbox = document.getElementById('lightboxOverlay');
    if(lightbox.classList.contains('open')){ closeLightbox(); return; }
    const modal = document.getElementById('modalOverlay');
    if(modal.classList.contains('open')){ closeModal(); return; }
    const stats = document.getElementById('statsOverlay');
    if(stats.classList.contains('open')){ closeStats(); return; }
  }
});

// ---- Başlangıç ----
applySavedTheme();
applySavedFontScale();
initVoiceSearchButton();
renderTodayCarBanner();
renderRecentStrip();

renderFilters();
renderMain();
openFromHash();
</script>
</body>
</html>
