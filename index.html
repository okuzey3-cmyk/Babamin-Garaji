<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babamın Garajı | VIP Klasik Koleksiyonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .garage-gradient { background: linear-gradient(135deg, #111827 0%, #1f2937 50%, #0f172a 100%); }
        .card-glass { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="garage-gradient text-gray-100 min-h-screen">

    <!-- Header & Arama -->
    <header class="border-b border-gray-800 bg-gray-900/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <span class="text-amber-500 font-semibold tracking-widest text-xs uppercase">VIP Koleksiyon</span>
                <h1 class="text-2xl sm:text-3xl font-bold font-serif text-white tracking-wide">Babamın Garajı</h1>
            </div>
            <!-- Arama Çubuğu -->
            <div class="w-full sm:w-72">
                <input type="text" id="searchInput" placeholder="Garajda ara (Örn: Mustang, 1968)..." 
                       class="w-full bg-gray-800 border border-gray-700 text-sm rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition"
                       onkeyup="filterCars()">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="car-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Yükleniyor Mesajı -->
            <div class="col-span-full text-center text-gray-400 py-10">
                Garaj kapıları açılıyor, araçlar getiriliyor...
            </div>
        </div>
    </main>

    <!-- Modal (Detay ve Galeri) -->
    <div id="car-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-2 sm:p-4 backdrop-blur-md">
        <div class="card-glass rounded-2xl max-w-4xl w-full max-h-[95vh] overflow-y-auto relative border border-gray-700 shadow-2xl flex flex-col">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-white bg-red-600/80 hover:bg-red-600 z-50 w-8 h-8 flex items-center justify-center rounded-full transition">
                ✕
            </button>
            <div id="modal-content" class="flex-grow"></div>
        </div>
    </div>

    <script>
        let allCars = [];
        let currentCarImages = [];
        let currentImageIndex = 0;

        // Veritabanından (JSON) araçları çekme işlemi
        fetch('arabalar.json')
            .then(response => response.json())
            .then(data => {
                allCars = data;
                renderCars(allCars);
            })
            .catch(error => {
                document.getElementById('car-grid').innerHTML = '<div class="col-span-full text-center text-red-400">Araçlar yüklenirken bir hata oluştu.</div>';
            });

        // Araçları Ekrana Çizme
        function renderCars(carsToRender) {
            const grid = document.getElementById('car-grid');
            if(carsToRender.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-400">Aradığınız araç garajda bulunamadı.</div>';
                return;
            }

            grid.innerHTML = carsToRender.map((car, index) => `
                <div class="card-glass rounded-2xl overflow-hidden shadow-xl hover:border-amber-500/50 transition duration-300 flex flex-col">
                    <!-- Vitrin Resmi -->
                    <div class="h-56 w-full relative">
                        <img src="${car.images[0]}" alt="${car.name}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
                        <div class="absolute bottom-4 left-4">
                            <span class="text-xs uppercase tracking-widest text-amber-400 font-bold bg-black/50 px-2 py-1 rounded-md backdrop-blur-sm">${car.year}</span>
                            <h3 class="text-xl font-bold font-serif text-white mt-1 shadow-black drop-shadow-md">${car.name}</h3>
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between bg-gray-900/50">
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${car.story}</p>
                        <button onclick="openModal(${car.id})" class="w-full bg-gray-800 border border-gray-700 hover:border-amber-500 text-amber-500 font-semibold py-2.5 px-4 rounded-xl transition text-sm">
                            Galeriyi ve Detayları Aç
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Arama Kutusu Filtresi
        function filterCars() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCars.filter(car => 
                car.name.toLowerCase().includes(searchText) || 
                car.year.includes(searchText) ||
                car.category.toLowerCase().includes(searchText)
            );
            renderCars(filtered);
        }

        // Galeri Resmi Değiştirme
        function changeImage(step) {
            currentImageIndex += step;
            if (currentImageIndex >= currentCarImages.length) currentImageIndex = 0;
            if (currentImageIndex < 0) currentImageIndex = currentCarImages.length - 1;
            document.getElementById('gallery-image').src = currentCarImages[currentImageIndex];
            document.getElementById('gallery-counter').innerText = (currentImageIndex + 1) + " / " + currentCarImages.length;
        }

        // Detay Penceresini Açma
        function openModal(carId) {
            const car = allCars.find(c => c.id === carId);
            currentCarImages = car.images;
            currentImageIndex = 0;

            const modalContent = document.getElementById('modal-content');
            
            modalContent.innerHTML = `
                <!-- Fotoğraf Galerisi -->
                <div class="relative w-full h-64 sm:h-96 bg-black rounded-t-2xl overflow-hidden group">
                    <img id="gallery-image" src="${car.images[0]}" class="w-full h-full object-contain transition-all duration-300">
                    
                    <!-- Sol/Sağ Oklar -->
                    <button onclick="changeImage(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-amber-500 text-white p-3 rounded-full backdrop-blur-sm transition">❮</button>
                    <button onclick="changeImage(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-amber-500 text-white p-3 rounded-full backdrop-blur-sm transition">❯</button>
                    
                    <!-- Sayaç -->
                    <div id="gallery-counter" class="absolute bottom-4 right-4 bg-black/70 text-white text-xs px-3 py-1 rounded-full backdrop-blur-sm">
                        1 / ${car.images.length}
                    </div>
                </div>

                <!-- Bilgiler -->
                <div class="p-6 sm:p-8">
                    <div class="mb-6 border-b border-gray-800 pb-4">
                        <span class="text-xs uppercase tracking-widest text-amber-500 font-semibold">${car.category}</span>
                        <h2 class="text-2xl sm:text-4xl font-bold font-serif text-white mt-1">${car.name} <span class="text-gray-500 text-2xl">(${car.year})</span></h2>
                    </div>
                    
                    <p class="text-gray-300 text-sm sm:text-base mb-8 leading-relaxed">${car.story}</p>
                    
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50"><span class="block text-[10px] uppercase text-gray-500 mb-1">Motor</span><strong class="text-sm text-gray-200">${car.engine}</strong></div>
                        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50"><span class="block text-[10px] uppercase text-gray-500 mb-1">Güç</span><strong class="text-sm text-gray-200">${car.power}</strong></div>
                        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50"><span class="block text-[10px] uppercase text-gray-500 mb-1">Maks. Hız</span><strong class="text-sm text-gray-200">${car.speed}</strong></div>
                        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50"><span class="block text-[10px] uppercase text-gray-500 mb-1">0-100 km/s</span><strong class="text-sm text-gray-200">${car.accel}</strong></div>
                        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50"><span class="block text-[10px] uppercase text-gray-500 mb-1">Ağırlık</span><strong class="text-sm text-gray-200">${car.weight}</strong></div>
                        <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/50"><span class="block text-[10px] uppercase text-gray-500 mb-1">Şanzıman</span><strong class="text-sm text-gray-200">${car.transmission}</strong></div>
                    </div>

                    <div class="bg-amber-500/10 border border-amber-500/20 p-5 rounded-xl flex gap-4 items-start">
                        <div class="text-amber-500 text-2xl">💡</div>
                        <div>
                            <h5 class="text-xs uppercase tracking-wider text-amber-500 font-bold mb-1">Biliyor muydunuz?</h5>
                            <p class="text-sm text-gray-300">${car.didYouKnow}</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('car-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('car-modal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('car-modal');
            if (event.target === modal) closeModal();
        }
    </script>
</body>
</html>
