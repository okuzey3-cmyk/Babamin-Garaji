    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

    </style>

<body class="garage-gradient text-gray-100 min-h-screen">

    <header class="border-b border-gray-800 bg-gray-900/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center">
            <div class="text-center sm:text-left mb-4 sm:mb-0">
                <span class="text-amber-500 font-semibold tracking-widest text-xs uppercase">Özel Koleksiyon</span>

            </div>

    </header>

            <h2 class="text-2xl sm:text-3xl font-bold font-serif mb-4">Zamansız Tasarımlar, Efsanevi Motorlar</h2>
            <p class="text-gray-400 text-sm sm:text-base">Otomotiv tarihine damga vurmuş, garajın en özel klasiklerini keşfedin.</p>
        </div>

        <!-- Car Grid -->

            <!-- JavaScript ile doldurulacak -->
        </div>
    </main>

    <!-- Modal -->
    <div id="car-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">

            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-gray-800/80 p-2 rounded-full transition">
                ✕
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Footer -->

        <p>Babamın Garajı &copy; 2026 | Tüm efsaneler tek bir çatı altında.</p>
    </footer>

        function renderCars() {
            const grid = document.getElementById('car-grid');
            grid.innerHTML = cars.map((car, index) => `
                <div class="card-glass rounded-2xl overflow-hidden shadow-xl hover:border-amber-500/50 transition duration-300 flex flex-col justify-between">
                    <div class="h-48 bg-gradient-to-br ${car.color} p-6 flex flex-col justify-between relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 text-white/10 font-bold font-serif text-8xl pointer-events-none">${car.year}</div>
                        <div>
                            <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold bg-black/30 px-3 py-1 rounded-full">${car.category}</span>
                            <h3 class="text-2xl font-bold font-serif text-white mt-3">${car.name}</h3>
                        </div>
                        <span class="text-gray-300 text-sm font-medium">${car.year}</span>
                    </div>
                    <div class="p-6 flex flex-col flex-grow justify-between">
                        <p class="text-gray-300 text-sm mb-6 line-clamp-2">${car.story}</p>
                        <button onclick="openModal(${index})" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-2.5 px-4 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm">
                            Garaj Detayını İncele
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            const car = cars[index];
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="mb-6">
                    <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">${car.category} • ${car.year}</span>
                    <h2 class="text-3xl font-bold font-serif text-white mt-1">${car.name}</h2>
                </div>
                <p class="text-gray-300 text-sm sm:text-base mb-6 leading-relaxed">${car.story}</p>
                
                <h4 class="text-sm font-semibold text-amber-500 uppercase tracking-wider mb-3">Teknik Özellikler</h4>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6 text-sm">
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Motor</span><strong>${car.engine}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Güç</span><strong>${car.power}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Tork</span><strong>${car.torque}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Maks. Hız</span><strong>${car.speed}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">0-100 km/s</span><strong>${car.accel}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Ağırlık</span><strong>${car.weight}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Üretim Adedi</span><strong>${car.produced}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Düzen</span><strong>${car.layout}</strong></div>
                    <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/50"><span class="block text-xs text-gray-400">Şanzıman</span><strong>${car.transmission}</strong></div>
                </div>

                <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl">
                    <h5 class="text-xs uppercase tracking-wider text-amber-400 font-semibold mb-1">Biliyor muydunuz?</h5>
                    <p class="text-sm text-gray-300">${car.didYouKnow}</p>
                </div>
            `;
            document.getElementById('car-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('car-modal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('car-modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        renderCars();
    </script>
</body>
</html>
