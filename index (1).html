<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babamın Garajı — Klasik Otomobil Koleksiyonu</title>
<meta name="description" content="Klasik otomobillerin detaylı Türkçe arşivi. Efsanevi arabaların teknik özellikleri, tarihi ve hikayeleri.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0B08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0D0B08;--bg2:#161310;--bg3:#1E1A16;
  --gold:#C9A96E;--gold2:#A8884E;--gold3:#E0C992;
  --cream:#E8E0D4;--cream2:#B0A899;--cream3:#7A7470;
  --border:#2A2520;--border2:#3A3530;
  --red:#8B2500;
}
body{background:var(--bg);color:var(--cream);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}

.container{max-width:760px;margin:0 auto;padding:0 16px}

/* HERO */
.hero{text-align:center;padding:56px 20px 36px;border-bottom:1px solid var(--border)}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,42px);font-weight:700;color:var(--cream);letter-spacing:-0.5px}
.hero-sub{font-size:12px;color:var(--cream3);letter-spacing:3px;text-transform:uppercase;margin:6px 0 32px}
.hero-btn{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--gold);color:var(--bg);border:none;
  padding:14px 32px;font-size:15px;font-weight:600;
  border-radius:8px;cursor:pointer;font-family:inherit;
  transition:all .2s;
}
.hero-btn:hover{background:var(--gold3);transform:translateY(-1px)}
.hero-btn:active{transform:scale(.98)}
.hero-btn svg{width:20px;height:20px}

/* FILTERS */
.filters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:24px 0 12px}
.filter-select{
  background:var(--bg2);color:var(--cream);
  border:1px solid var(--border);padding:9px 14px;
  border-radius:8px;font-size:13px;font-family:inherit;
  cursor:pointer;min-width:140px;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%237A7470' fill='none' stroke-width='1.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;
  padding-right:32px;
}
.filter-select:focus{outline:none;border-color:var(--gold2)}

.count{text-align:center;font-size:13px;color:var(--cream3);padding:8px 0 20px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;padding-bottom:28px}
.grid-item{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;cursor:pointer;
  transition:all .25s;
}
.grid-item:hover{border-color:var(--gold2);transform:translateY(-3px)}
.grid-item.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.grid-thumb{
  height:90px;display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:17px;font-weight:600;
  color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.4);
  position:relative;
}
.grid-thumb span{position:relative;z-index:1;padding:0 8px;text-align:center;line-height:1.2}
.grid-info{padding:8px 10px 10px}
.grid-brand{font-size:10px;color:var(--cream3);text-transform:uppercase;letter-spacing:.8px}
.grid-model{font-size:13px;font-weight:500;color:var(--cream);margin-top:2px}

/* DETAIL CARD */
.detail{padding-bottom:48px;display:none}
.detail.show{display:block;animation:fadeIn .5s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-visual{
  height:240px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.card-badge{
  position:absolute;top:14px;left:14px;
  background:rgba(0,0,0,.55);color:#fff;padding:4px 12px;
  border-radius:20px;font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;
  backdrop-filter:blur(6px);
}
.card-year{
  position:absolute;top:14px;right:14px;
  background:rgba(255,255,255,.12);color:#fff;padding:4px 12px;
  border-radius:20px;font-size:12px;font-weight:500;backdrop-filter:blur(6px);
}
.card-model{
  font-family:'Playfair Display',serif;font-size:clamp(30px,7vw,44px);
  font-weight:700;color:rgba(255,255,255,.95);
  text-shadow:0 2px 16px rgba(0,0,0,.5);text-align:center;line-height:1.1;
}
.card-origin{
  font-size:15px;color:rgba(255,255,255,.65);font-weight:300;
  margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.3);text-align:center;
}

.card-body{padding:24px}
.card-body h3{
  font-family:'Playfair Display',serif;font-size:17px;font-weight:600;
  color:var(--gold);margin:28px 0 12px;
}
.card-body h3:first-child{margin-top:0}
.card-body p{font-size:14px;line-height:1.8;color:var(--cream2);margin:0 0 10px}

/* DESIGNER */
.designer{
  display:flex;align-items:center;gap:12px;
  background:var(--bg3);border-radius:8px;padding:14px;margin:14px 0;
}
.designer-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;color:var(--bg);flex-shrink:0;
}
.designer-name{font-size:14px;font-weight:500;color:var(--cream)}
.designer-role{font-size:12px;color:var(--cream3)}

/* SPECS */
.specs{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:var(--border);border-radius:8px;overflow:hidden;margin:14px 0;
}
.spec{background:var(--bg3);padding:12px 14px}
.spec-label{font-size:10px;color:var(--cream3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.spec-value{font-size:13px;font-weight:500;color:var(--cream)}

/* ERA */
.era{
  background:var(--bg3);border-radius:8px;padding:16px;margin:14px 0;
  border-left:3px solid var(--gold);
}
.era-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-bottom:8px;font-weight:600}
.era p{font-size:13px;line-height:1.75;color:var(--cream2);font-style:italic;margin:0}

/* FACTS */
.fact{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.65;color:var(--cream2)}
.fact:last-child{border-bottom:none}
.fact-num{
  flex-shrink:0;width:24px;height:24px;border-radius:50%;
  background:var(--gold);color:var(--bg);display:flex;
  align-items:center;justify-content:center;
  font-size:11px;font-weight:700;margin-top:2px;
}

/* RELATED */
.related{
  font-size:13px;color:var(--cream2);background:var(--bg3);
  border-radius:8px;padding:12px 14px;margin-top:14px;
}
.related strong{color:var(--gold);font-weight:500}

/* CENTER BTN */
.center-btn{text-align:center;margin-top:24px}

/* FOOTER */
.footer{text-align:center;padding:32px 0 20px;border-top:1px solid var(--border);margin-top:24px}
.footer-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--cream3)}
.footer-sub{font-size:11px;color:var(--border2);margin-top:4px}

/* SEARCH */
.search-wrap{display:flex;justify-content:center;padding:0 0 8px}
.search-input{
  background:var(--bg2);color:var(--cream);border:1px solid var(--border);
  padding:9px 14px 9px 36px;border-radius:8px;font-size:13px;
  font-family:inherit;width:100%;max-width:320px;
  background-image:url("data:image/svg+xml,%3Csvg width='14' height='14' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='6' cy='6' r='5' stroke='%237A7470' fill='none' stroke-width='1.2'/%3E%3Cline x1='10' y1='10' x2='13' y2='13' stroke='%237A7470' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:12px center;
}
.search-input:focus{outline:none;border-color:var(--gold2)}
.search-input::placeholder{color:var(--cream3)}

/* SCROLL TO TOP */
.scroll-top{
  position:fixed;bottom:24px;right:24px;width:44px;height:44px;
  border-radius:50%;background:var(--gold);color:var(--bg);
  border:none;cursor:pointer;font-size:18px;display:none;
  align-items:center;justify-content:center;z-index:99;
  box-shadow:0 4px 16px rgba(0,0,0,.4);transition:all .2s;
}
.scroll-top:hover{transform:scale(1.1)}
.scroll-top.show{display:flex}

@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .card-body{padding:18px}
  .specs{grid-template-columns:1fr 1fr}
  .hero{padding:40px 16px 28px}
}
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <div class="hero-title">Babamın Garajı</div>
    <div class="hero-sub">Klasik Otomobil Koleksiyonu</div>
    <button class="hero-btn" onclick="pickRandom()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Rastgele Araba Getir
    </button>
  </div>

  <div class="filters">
    <select class="filter-select" id="brandFilter" onchange="applyFilters()">
      <option value="">Tüm markalar</option>
    </select>
    <select class="filter-select" id="decadeFilter" onchange="applyFilters()">
      <option value="">Tüm yıllar</option>

      <option value="1970">1970'lar</option>
      <option value="1980">1980'lar</option>
      <option value="1990">1990'lar</option>
    </select>
  </div>

  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Araba ara..." oninput="applyFilters()">
  </div>

  <div class="count" id="countText"></div>
  <div class="grid" id="carGrid"></div>

  <div class="detail" id="detailSection"></div>

  <div class="footer">
    <div class="footer-title">Babamın Garajı</div>
    <div class="footer-sub">Sevgiyle hazırlandı</div>
  </div>
</div>

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

// =====================================================
// UYGULAMA KODU
// =====================================================
var currentCar = null;

function getBrands() {
  var brands = [];
  CARS.forEach(function(c) { if (brands.indexOf(c.brand) === -1) brands.push(c.brand); });
  return brands.sort();
}

function getStartYear(car) {
  return parseInt(car.year);
}

function filterCars() {
  var brand = document.getElementById('brandFilter').value;
  var decade = document.getElementById('decadeFilter').value;
  var search = document.getElementById('searchInput').value.toLowerCase().trim();
  return CARS.filter(function(c) {
    if (brand && c.brand !== brand) return false;
    if (decade) {
      var y = getStartYear(c);
      var d = parseInt(decade);
      if (y < d || y >= d + 10) return false;
    }
    if (search) {
      var haystack = (c.brand + ' ' + c.model + ' ' + c.year + ' ' + c.origin + ' ' + c.designer).toLowerCase();
      if (haystack.indexOf(search) === -1) return false;
    }
    return true;
  });
}

function renderGrid(cars) {
  var grid = document.getElementById('carGrid');
  grid.innerHTML = '';
  cars.forEach(function(car) {
    var div = document.createElement('div');
    div.className = 'grid-item' + (currentCar && currentCar.id === car.id ? ' active' : '');
    div.onclick = function() { showCar(car); };
    var label = car.model.length > 14 ? car.model.split(' ')[0] : car.model;
    div.innerHTML = '<div class="grid-thumb" style="background:linear-gradient(135deg,' + car.color1 + ',' + car.color2 + ')"><span>' + label + '</span></div>' +
      '<div class="grid-info"><div class="grid-brand">' + car.brand + '</div><div class="grid-model">' + car.model + ' · ' + car.year.split('–')[0] + '</div></div>';
    grid.appendChild(div);
  });
  document.getElementById('countText').textContent = cars.length + ' klasik otomobil listeleniyor';
}

function showCar(car) {
  currentCar = car;
  var section = document.getElementById('detailSection');

  var factsHtml = '';
  car.funFacts.forEach(function(f, i) {
    factsHtml += '<div class="fact"><div class="fact-num">' + (i + 1) + '</div><div>' + f + '</div></div>';
  });

  section.innerHTML =
    '<div class="card">' +
      '<div class="card-visual" style="background:linear-gradient(160deg,' + car.color1 + ' 0%,' + car.color2 + ' 50%,' + car.color1 + 'dd 100%)">' +
        '<div class="card-badge">' + car.brand + '</div>' +
        '<div class="card-year">' + car.year + '</div>' +
        '<div><div class="card-model">' + car.model + '</div><div class="card-origin">' + car.origin + '</div></div>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3>Hakkında</h3>' +
        '<p>' + car.description + '</p>' +
        '<div class="designer">' +
          '<div class="designer-avatar">' + car.designer.charAt(0) + '</div>' +
          '<div><div class="designer-name">' + car.designer + '</div><div class="designer-role">Tasarımcı / Mühendis</div></div>' +
        '</div>' +
        '<h3>Teknik özellikler</h3>' +
        '<div class="specs">' +
          specBox('Motor', car.engine) +
          specBox('Güç', car.hp) +
          specBox('Tork', car.torque) +
          specBox('Maks. hız', car.topSpeed) +
          specBox('Hızlanma', car.acceleration) +
          specBox('Ağırlık', car.weight) +
          specBox('Üretim', car.production) +
          specBox('Düzen', car.layout) +
          specBox('Şanzıman', car.transmission) +
        '</div>' +
        '<h3>Dönemin hikâyesi</h3>' +
        '<div class="era"><div class="era-label">Tarihsel bağlam</div><p>' + car.eraStory + '</p></div>' +
        '<h3>Biliyor muydunuz?</h3>' +
        factsHtml +
        '<h3>İlgili modeller</h3>' +
        '<div class="related"><strong>Aynı dönemden: </strong>' + car.relatedModels + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="center-btn"><button class="hero-btn" onclick="pickRandom()">&#8635; Başka bir araba göster</button></div>';

  section.className = 'detail show';
  applyFilters();
  setTimeout(function() {
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function specBox(label, value) {
  return '<div class="spec"><div class="spec-label">' + label + '</div><div class="spec-value">' + value + '</div></div>';
}

function pickRandom() {
  var pool = filterCars();
  if (pool.length === 0) pool = CARS;
  var car = pool[Math.floor(Math.random() * pool.length)];
  showCar(car);
}

function applyFilters() {
  renderGrid(filterCars());
}

// SCROLL TO TOP
window.addEventListener('scroll', function() {
  var btn = document.getElementById('scrollTopBtn');
  btn.className = window.scrollY > 400 ? 'scroll-top show' : 'scroll-top';
});

// INIT
(function() {
  var sel = document.getElementById('brandFilter');
  getBrands().forEach(function(b) {
    var opt = document.createElement('option');
    opt.value = b;
    opt.textContent = b;
    sel.appendChild(opt);
  });
  applyFilters();
})();
</script>
